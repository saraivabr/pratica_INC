<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" fill="none">
  <!-- Stylized P with vertical lines -->
  <g fill="#6B1C23">
    <!-- Vertical lines forming the P -->
    <rect x="0" y="5" width="2" height="50" />
    <rect x="4" y="5" width="2" height="50" />
    <rect x="8" y="5" width="2" height="50" />
    <rect x="12" y="5" width="2" height="50" />
    <rect x="16" y="5" width="2" height="50" />
    <rect x="20" y="5" width="2" height="50" />
    <rect x="24" y="5" width="2" height="50" />
    <rect x="28" y="5" width="2" height="50" />
    <!-- Horizontal bar of P -->
    <rect x="28" y="5" width="18" height="2" />
    <rect x="28" y="9" width="18" height="2" />
    <rect x="28" y="13" width="18" height="2" />
    <rect x="28" y="17" width="18" height="2" />
    <rect x="28" y="21" width="18" height="2" />
    <rect x="28" y="25" width="18" height="2" />
    <!-- Curved part approximation -->
    <rect x="44" y="7" width="2" height="22" />
    <rect x="42" y="27" width="4" height="2" />
  </g>

  <!-- "pratica" text -->
  <text x="58" y="32" font-family="Arial, sans-serif" font-size="28" font-weight="400" letter-spacing="8" fill="#6B1C23">
    pratica
  </text>

  <!-- "incorporadora" text -->
  <text x="58" y="50" font-family="Arial, sans-serif" font-size="12" font-weight="400" letter-spacing="4" fill="#6B1C23">
    incorporadora
  </text>
</svg>
