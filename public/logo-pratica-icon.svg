<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- Stylized P with vertical lines -->
  <g fill="#6B1C23">
    <!-- Vertical lines forming the P -->
    <rect x="4" y="6" width="2" height="36" />
    <rect x="8" y="6" width="2" height="36" />
    <rect x="12" y="6" width="2" height="36" />
    <rect x="16" y="6" width="2" height="36" />
    <rect x="20" y="6" width="2" height="36" />
    <rect x="24" y="6" width="2" height="36" />
    <rect x="28" y="6" width="2" height="36" />
    <rect x="32" y="6" width="2" height="36" />
    <!-- Horizontal bars of P top -->
    <rect x="32" y="6" width="10" height="2" />
    <rect x="32" y="10" width="10" height="2" />
    <rect x="32" y="14" width="10" height="2" />
    <rect x="32" y="18" width="10" height="2" />
    <!-- Curved right part -->
    <rect x="40" y="8" width="2" height="14" />
